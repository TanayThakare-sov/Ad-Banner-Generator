<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ad Banner Generator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Ad &amp; Promotion Banner Generator</h1></header>
<main>
  <section class="panel" aria-label="Banner inputs">
    <label for="headline">Headline (max 40)</label><input id="headline" maxlength="60" value="Year-End Mega Sale">
    <label for="offer">Offer (max 30)</label><input id="offer" maxlength="50" value="Up to 50% off">
    <label for="cta">Button text (max 18)</label><input id="cta" maxlength="30" value="Shop Now">
    <label for="color">Brand color</label><select id="color"></select>
    <label for="image">Background image (optional)</label><input id="image" type="file" accept="image/*">
    <ul id="messages" aria-live="polite"></ul>
    <hr><label for="tname">Save as template</label>
    <input id="tname" placeholder="Template name"><button id="save" type="button">Save template</button>
    <p><strong>Saved templates</strong></p><ul id="templates"></ul>
  </section>
  <section aria-label="Previews"><div id="previews"></div></section>
</main>
<script src="js/banners.js"></script>
<script src="js/app.js"></script>
</body>
</html>
